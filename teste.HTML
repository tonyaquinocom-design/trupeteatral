<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram | Meu Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fafafa;
      color: #222;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #777;
      font-size: 15px;
    }

    .instagram-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 25px;
      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .instagram-link:hover {
      transform: scale(1.05);
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .profile-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #d62976;
    }

    .profile-info h2 {
      margin-bottom: 6px;
    }

    .profile-info p {
      color: #666;
    }

    .posts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .post {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
    }

    .post img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .post:hover img {
      transform: scale(1.08);
    }

    .post-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: 0.3s;
    }

    .post:hover .post-overlay {
      opacity: 1;
    }

    .post-overlay span {
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #fff;
      border-top: 1px solid #ddd;
      color: #777;
    }

    @media (max-width: 700px) {
      .posts {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .profile {
        align-items: flex-start;
      }

      .profile-photo {
        width: 70px;
        height: 70px;
      }

      header h1 {
        font-size: 23px;
      }
    }

    @media (max-width: 450px) {
      .posts {
        grid-template-columns: 1fr 1fr;
      }

      .container {
        width: 96%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📸 Nosso Instagram</h1>
    <p>Acompanhe nossas novidades e publicações.</p>

    <a

  <main class="container">

        alt="Foto do perfil"

    <section class="posts">

      <a class="post" href="#" target="_blank">

      <a class="post" href="#" target="_blank">

</html>
